version: "3.8"

services:
  db_test:
    image: postgres
    container_name: github-notifier-db-test
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata_test:
